<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Nova</title>
    <link rel="icon" href="assets/logo.svg" />
    <link rel="stylesheet" href="css/nova.css" />
    <script>
      window.__booted = false;
      addEventListener(
        'error',
        function (e) {
          if (window.__booted) return;
          var box =
            document.getElementById('boot-error') ||
            document.body.appendChild(Object.assign(document.createElement('pre'), { id: 'boot-error' }));
          box.style.cssText =
            'position:fixed;inset:auto 1rem 4rem;z-index:99;padding:1rem;border-radius:.5rem;background:#300;color:#fff;font:14px monospace;white-space:pre-wrap';
          box.textContent +=
            'Nova could not start: ' +
            (e.message || 'a file failed to load') +
            (e.filename
              ? '\n' + e.filename.split('/').pop() + ':' + e.lineno
              : e.target && e.target.src
                ? '\n' + e.target.src
                : '') +
            '\n';
        },
        true,
      );
    </script>
  </head>
  <body>
    <header class="top">
      <button class="me" id="me" data-nav>
        <img id="me-avatar" src="assets/avatar.svg" alt="" />
        <span><b id="me-name">Guest</b><small id="me-sub">Sign in</small></span>
      </button>
      <div class="spacer"></div>
      <div class="status">
        <span class="i" id="s-pad" hidden></span>
        <span class="i" id="s-bt" hidden></span>
        <span class="i" id="s-cell" hidden></span>
        <span class="i" id="s-wifi"></span>
        <span class="i" id="s-bat"></span><span class="pct" id="s-pct"></span>
      </div>
      <time class="clock" id="clock"></time>
    </header>

    <section class="screen" id="home" data-name="Home" data-icon="home">
      <div class="now-title"><b id="now-title"></b><small id="now-sub"></small></div>
      <div class="row-games" id="games" data-zone="games"></div>
      <div class="round-label" id="dock-label"></div>
      <nav class="dock" id="dock" data-zone="dock">
        <button class="round" data-nav data-go="friends" data-label="Friends">
          <span class="i" data-i="friends"></span>
        </button>
        <button class="round" data-nav data-go="messages" data-label="Messages">
          <span class="i" data-i="messages"></span><span class="count" id="dock-unread" hidden></span>
        </button>
        <button class="round" data-nav data-go="apps" data-label="Apps">
          <span class="i" data-i="apps"></span>
        </button>
        <button class="round" data-nav data-go="settings" data-label="System Settings">
          <span class="i" data-i="settings"></span>
        </button>
        <button class="round" data-nav data-go="power" data-label="Power">
          <span class="i" data-i="power"></span>
        </button>
      </nav>
    </section>

    <section class="screen" id="apps" data-name="Apps" data-icon="apps">
      <div class="screen-head">
        <span class="i" data-i="apps"></span>
        <h1>Apps</h1>
      </div>
      <div class="app-grid scroll fades" id="app-grid" data-zone="apps"></div>
    </section>

    <section class="screen" id="settings" data-name="System Settings" data-icon="settings">
      <div class="split">
        <nav class="side fades" id="set-side" data-zone="side"></nav>
        <div class="pane" id="set-pane"></div>
      </div>
    </section>

    <section class="screen" id="friends" data-name="Friends" data-icon="friends">
      <div id="friends-body" style="height: 100%"></div>
    </section>

    <section class="screen" id="messages" data-name="Messages" data-icon="messages">
      <div id="messages-body" style="height: 100%"></div>
    </section>

    <footer class="prompts">
      <div class="where"><span class="i" id="where-icon"></span><span id="where-name"></span></div>
      <div id="prompts" style="display: contents"></div>
    </footer>

    <div class="layer" id="quick" hidden>
      <aside class="panel fades" id="quick-panel">
        <div class="game-strip" id="game-strip" hidden>
          <div class="gs-art" id="gs-art"></div>
          <div class="gs-text"><small>Paused</small><b id="gs-title"></b><small id="gs-time"></small></div>
          <div class="gs-actions">
            <button class="chip primary" data-nav data-autofocus id="gs-resume">Resume</button>
            <button class="chip" data-nav id="gs-quit">Quit game</button>
          </div>
        </div>
        <div class="q-head">
          <time class="clock" id="q-clock"></time
          ><small
            ><span data-bind="system.battery.level" data-fmt="pct"></span> ·
            <span data-bind="system.battery.time_remaining" data-fmt="left"></span
          ></small>
        </div>
        <div class="q-grid">
          <button class="qt" data-nav data-toggle="system.wifi.enabled">
            <span class="i" data-i="wifi"></span>Wi-Fi
          </button>
          <button class="qt" data-nav data-toggle="system.bluetooth.enabled">
            <span class="i" data-i="bluetooth"></span>Bluetooth
          </button>
          <button class="qt" data-nav data-toggle="system.network.airplane">
            <span class="i" data-i="plane"></span>Airplane
          </button>
          <button class="qt" data-nav data-toggle="system.network.mobile_data">
            <span class="i" data-i="cellular"></span>Data
          </button>
          <button class="qt" data-nav data-toggle="system.notifications.dnd">
            <span class="i" data-i="moon"></span>Quiet
          </button>
          <button class="qt" data-nav data-toggle="system.flashlight.enabled">
            <span class="i" data-i="flashlight"></span>Torch
          </button>
          <button class="qt" data-nav data-toggle="system.display.rotation_lock">
            <span class="i" data-i="rotation"></span>Lock rotation
          </button>
          <button class="qt" data-nav data-toggle="system.display.night_light">
            <span class="i" data-i="night"></span>Night Light
          </button>
        </div>
        <div class="row slider" data-nav data-slider="system.display.brightness">
          <span class="i" data-i="brightness"></span>
          <div class="track"><b></b></div>
          <em></em>
        </div>
        <div class="row slider" data-nav data-slider="system.audio.volume">
          <span class="i" data-i="volume"></span>
          <div class="track"><b></b></div>
          <em></em>
        </div>
        <h3>Performance</h3>
        <div class="q-seg">
          <span class="i" data-i="chip"></span>
          <div
            class="seg"
            data-choice="system.performance.profile"
            data-options="system.performance.profiles"
          ></div>
        </div>
        <div class="q-seg">
          <span class="i" data-i="fan"></span>
          <div class="seg" data-choice="system.fan.mode" data-options="system.fan.modes"></div>
        </div>
        <div class="grid two" style="margin-top: 0.2rem">
          <div class="kv">
            <span>CPU</span><b data-bind="system.performance.cpu_temp" data-fmt="temp"></b>
          </div>
          <div class="kv"><span>Draw</span><b data-bind="system.battery.power" data-fmt="watt"></b></div>
        </div>
        <div class="chips" style="margin-top: 0.3rem">
          <button class="chip" data-nav id="q-shot"><span class="i" data-i="camera"></span>Screenshot</button>
          <button class="chip" data-nav data-call="system.power.sleep">
            <span class="i" data-i="moon"></span>Sleep
          </button>
        </div>
      </aside>
    </div>

    <div class="layer dialog" id="dialog" hidden>
      <div class="dialog-card fades">
        <h2 id="dialog-title"></h2>
        <p id="dialog-text"></p>
        <div id="dialog-extra"></div>
        <div class="dialog-actions" id="dialog-actions"></div>
      </div>
    </div>

    <div class="notes" id="notes"></div>

    <script src="/warp.js"></script>
    <script src="/warp-mock.js"></script>
    <script src="js/vendor/qrcode.js"></script>
    <script src="js/vendor/rotur-sdk.js"></script>
    <script src="js/core.js"></script>
    <script src="js/social.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
